<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>チャリ猫</title>
  <link rel="manifest" href="manifest.json?v=15">
  <link rel="stylesheet" href="styles.css?v=15">
</head>
<body>
<header class="appHeader">
  <button id="headerBack" class="iconBtn hidden" aria-label="前の画面へ">←</button>
  <button id="brand" class="brand" aria-label="ホームへ"><span>🐈‍⬛</span><span><strong>チャリ猫</strong><small id="headerStatus">今日の競輪</small></span></button>
  <button id="homeBtn" class="iconBtn" aria-label="ホームへ">⌂</button>
</header>
<main id="app" aria-live="polite">
  <section id="home" class="screen active">
    <section class="hero card homeHero"><div><small>TODAY'S RACES</small><h1>今日のレース</h1><p>開催確認から予想・保存まで、ここから進めます。</p></div><button id="todayKeirin" class="primary">競輪を開く</button></section>
    <section class="card compact recommendationPanel">
      <div class="sectionHead"><div><small>今日のおすすめ</small><h2>おすすめレース</h2></div><span id="recommendationCount" class="pill">0件</span></div>
      <div class="recommendationControls">
        <div class="sportChecks" aria-label="競技フィルタ">
          <label><input id="sportKeirin" type="checkbox" checked>競輪</label>
          <label class="disabled"><input type="checkbox" disabled>ボート</label>
          <label class="disabled"><input type="checkbox" disabled>オート</label>
          <label class="disabled"><input type="checkbox" disabled>競馬</label>
        </div>
        <label class="recommendationLimit">表示件数<select id="recommendationLimit"><option value="3">3件</option><option value="5" selected>5件</option><option value="10">10件</option></select></label>
      </div>
      <div id="todayRecommendations" class="recommendationList"></div>
      <p class="muted recommendationFootnote">現在は競輪のみ接続済み。今後、同じ欄で競技を横断して絞り込めます。</p>
    </section>
    <section class="card compact"><div class="sectionHead"><h2>保存済み予想</h2><span id="savedCount" class="pill">0件</span></div><div id="savedList" class="stack"></div></section>
  </section>

  <section id="meetings" class="screen">
    <div class="pageTitle"><div><small>KEIRIN</small><h1>今日の競輪</h1></div><span id="meetingCount" class="pill">0会場</span></div>
    <section class="card compact"><label>開催日<input id="raceDate" type="date"></label><button id="reloadMeetings" class="secondary">開催情報を再取得</button></section>
    <div id="meetingList" class="stack"></div>
  </section>

  <section id="races" class="screen">
    <div class="pageTitle"><div><small id="raceDateLabel">KEIRIN</small><h1 id="venueTitle">レース一覧</h1></div><span id="raceCount" class="pill">0R</span></div>
    <div id="raceList" class="raceGrid"></div>
  </section>

  <section id="detail" class="screen">
    <div class="pageTitle"><div><small id="detailDate">-</small><h1 id="detailTitle">レース詳細</h1></div><span id="raceStatus" class="pill">状態確認中</span></div>
    <section class="card compact"><div id="raceMeta" class="metaGrid"></div><div id="detailNotice"></div></section>
    <section class="card compact"><div class="sectionHead"><h2>出走選手</h2><span id="participantCount" class="pill">未取得</span></div><div id="participants" class="participants"><p class="muted">予想実行時に公式情報を取得します。</p></div></section>
    <section class="card compact"><div class="sectionHead"><h2>公式ライン</h2><span id="oddsStatus" class="pill">オッズ未取得</span></div><div id="officialLine" class="lineBox">予想実行時に取得します</div></section>
    <section id="predictionDetail" class="card compact hidden"></section>
    <section id="savedPrediction" class="card compact hidden"></section>
    <div class="actionBar"><button id="predictBtn" class="primary">このレースを予想</button><button id="retryDetail" class="secondary hidden">再試行</button></div>
  </section>

  <section id="prediction" class="screen">
    <div class="pageTitle"><div><small>保存済み予想</small><h1 id="predictionTitle">予想結果</h1></div><span id="savedBadge" class="pill success">保存済み</span></div>
    <section class="card"><div class="sectionHead"><h2 id="recommendation">-</h2><span id="predictionUpdated" class="muted"></span></div><div id="predictionSummary" class="metaGrid"></div></section>
    <section id="purchaseControls" class="card compact hidden"></section>
    <section id="betGroups" class="stack"></section>
    <section id="resultPanel" class="card hidden"></section>
    <div class="actionBar"><button id="checkResult" class="primary">公式結果を確認</button><button id="backToDetail" class="secondary">レース詳細へ</button></div>
  </section>

  <section id="loading" class="screen"><section class="card loadingCard"><div class="spinner"></div><h1 id="loadingTitle">取得中</h1><p id="loadingMessage">公式データを確認しています。</p></section></section>
  <section id="error" class="screen"><section class="card errorCard"><div class="errorIcon">!</div><h1 id="errorTitle">取得失敗</h1><p id="errorMessage"></p><button id="retryBtn" class="primary">再試行</button><button id="errorHome" class="secondary">ホームへ</button></section></section>
</main>
<script type="module" src="app.mjs?v=15"></script>
</body></html>
