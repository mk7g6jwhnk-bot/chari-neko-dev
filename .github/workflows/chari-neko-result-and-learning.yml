name: Chari Neko Result And Learning

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  result-and-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch official results and verify
        env:
          CHARI_NEKO_RESULT_FETCH_COMMAND: ${{ secrets.CHARI_NEKO_RESULT_FETCH_COMMAND }}
        run: bash .github/scripts/fetch-results-and-learn.sh

      - name: Save research learning data
        run: |
          git config user.name "chari-neko-learning"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results research/learning
          if git diff --cached --quiet; then
            echo "No new result or learning data"
            exit 0
          fi
          git commit -m "chore: fetch results and update research learning"
          git push
