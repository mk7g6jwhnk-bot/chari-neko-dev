name: Chari Neko Result Prediction Learning

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link-and-learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Link verified results with saved predictions
        env:
          CHARI_NEKO_RESULTS_DIR: ./research/results
          CHARI_NEKO_PREDICTIONS_DIR: ./research/predictions
          CHARI_NEKO_LEARNING_OUTPUT: ./research/learning
        run: node research/reverse-tree/engine/run-result-prediction-link.mjs

      - name: Save learning dataset
        run: |
          git config user.name "chari-neko-learning"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/learning
          if git diff --cached --quiet; then
            echo "No new linked learning data"
            exit 0
          fi
          git commit -m "chore: link results with saved predictions"
          git push
