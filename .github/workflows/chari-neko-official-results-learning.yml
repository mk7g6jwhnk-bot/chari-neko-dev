name: Chari Neko Official Results And Learning

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch official finished races
        run: node .github/scripts/collect-keirin-results.mjs

      - name: Run research learning
        run: node research/reverse-tree/engine/run-learning.mjs

      - name: Save result and learning data
        run: |
          git config user.name "chari-neko-learning"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results research/learning
          if git diff --cached --quiet; then
            echo "No new result or learning data"
            exit 0
          fi
          git commit -m "chore: collect official results and update learning"
          git push
