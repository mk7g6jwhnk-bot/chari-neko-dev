name: Chari Neko Learning

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run learning pipeline
        env:
          CHARI_NEKO_LEARNING_INPUT: ./research/results
          CHARI_NEKO_LEARNING_OUTPUT: ./research/learning
        run: node research/reverse-tree/engine/run-learning.mjs

      - name: Commit research learning data
        run: |
          git config user.name "chari-neko-learning"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/learning
          if git diff --cached --quiet; then
            echo "No new learning data"
            exit 0
          fi
          git commit -m "chore: update research learning data"
          git push
