<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>競輪統合版 DEV 0.4</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><small>MEETING → RACE → ENGINE</small><h1>🐈‍⬛ 競輪統合版 <em>DEV 0.4</em></h1><p id="headerStatus">開催情報を準備中</p></div><button id="discover">取得</button></header>
<main>
<section id="home" class="screen active"><section class="card"><label>開催日<input id="date" type="date"></label></section><section class="card"><div class="head"><h2>開催一覧</h2><span id="count" class="badge">0件</span></div><div id="meetings"></div></section></section>
<section id="races" class="screen"><div class="pageHead"><button data-back="home">←戻る</button><h2 id="venueTitle">会場</h2></div><section class="card"><div id="raceLinks"></div></section></section>
<section id="loading" class="screen"><div class="pageHead"><button data-back="races">←戻る</button><h2>解析中</h2></div><section class="card center"><div class="spinner"></div><p id="loadingText">公式出走表とオッズを取得中</p></section></section>
<section id="result" class="screen"><div class="pageHead"><button data-back="races">←戻る</button><h2 id="resultTitle">結果</h2></div><section class="card"><div class="summary"><div><span>ライン信頼度</span><strong id="lineConfidence">-</strong></div><div><span>締切</span><strong id="deadline">-</strong></div><div><span>全終端</span><strong id="terminals">-</strong></div><div><span>監査</span><strong id="audit">-</strong></div></div><p id="warnings"></p></section><section class="card"><div class="bet"><h3>本線</h3><p id="main">-</p></div><div class="bet"><h3>押さえ</h3><p id="backup">-</p></div><div class="bet"><h3>買える万車</h3><p id="value">-</p></div><div class="bet"><h3>厚め</h3><p id="strong">-</p></div></section><section class="card"><div class="summary"><div><span>合成オッズ</span><strong id="composite">-</strong></div><div><span>購入点数</span><strong id="points">-</strong></div></div><div id="plan"></div></section><section class="card"><details><summary>診断・監査情報</summary><pre id="debug"></pre></details></section></section>
</main><script type="module" src="app.mjs"></script></body></html>
