<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>チャリ猫予想 DEV 0.6</title><link rel="stylesheet" href="styles.css?v=06"></head><body>
<header><div><small>VENUE → RACE → PREDICTION</small><h1>🐈‍⬛ チャリ猫予想 <em>DEV 0.6</em></h1><p id="headerStatus">開催情報を準備中</p></div><button id="refresh">⟳ 更新</button></header>
<main>
<section id="home" class="screen active">
  <section class="card"><div class="head"><h2>開催日</h2><span id="scheduleBadge" class="badge">未取得</span></div><label>日付<input id="date" type="date"></label></section>
  <section class="card"><div class="head"><h2>開催中会場</h2><span id="venueCount" class="badge">0場</span></div><div id="venueGrid" class="venueGrid"></div></section>
</section>

<section id="races" class="screen">
  <div class="pageHead"><button data-back="home">← 戻る</button><div><small>RACE LIST</small><h2 id="venueTitle">会場</h2></div><span id="raceBadge" class="badge">0R</span></div>
  <section class="card"><label>購入締切<select id="lead"><option value="10">公式10分前</option><option value="7">公式7分前</option><option value="5" selected>公式5分前</option><option value="3">公式3分前</option></select></label><div id="raceGrid" class="raceGrid"></div></section>
</section>

<section id="loading" class="screen">
  <div class="pageHead"><button data-back="races">← 戻る</button><div><small>AUTO ANALYSIS</small><h2 id="loadingTitle">解析中</h2></div><span class="badge warn">解析中</span></div>
  <section class="card center"><div class="spinner"></div><h3 id="loadingStep">公式情報を取得中</h3><p>出走表・直前情報・オッズ・締切を確認しています。</p></section>
</section>

<section id="result" class="screen">
  <div class="pageHead"><button data-back="races">← 戻る</button><div><small>PREDICTION RESULT</small><h2 id="resultTitle">結果</h2></div><span id="resultBadge" class="badge ok">監査合格</span></div>
  <section class="card"><h2 id="recommendation">-</h2><p id="warnings"></p><div class="summary"><div><span>購入締切</span><strong id="purchaseDeadline">-</strong></div><div><span>公式締切</span><strong id="officialDeadline">-</strong></div><div><span>解析段階</span><strong id="stage">-</strong></div><div><span>オッズ</span><strong id="oddsQuality">-</strong></div></div></section>
  <section class="card"><div class="bet"><h3>本線</h3><p id="mainBets">-</p></div><div class="bet"><h3>押さえ</h3><p id="backupBets">-</p></div><div class="bet"><h3>買える万舟</h3><p id="valueBets">-</p></div><div class="bet"><h3>厚め</h3><p id="strongBets">-</p></div></section>
  <section class="card"><div class="summary"><div><span>合成オッズ</span><strong id="composite">-</strong></div><div><span>購入点数</span><strong id="points">-</strong></div><div><span>全終端</span><strong id="terminals">-</strong></div><div><span>監査</span><strong id="audit">-</strong></div></div><div id="plan"></div></section>
  <section class="card"><details><summary>取得診断・監査情報</summary><pre id="debug"></pre></details></section>
</section>
</main>
<script type="module" src="app.mjs?v=06"></script></body></html>
