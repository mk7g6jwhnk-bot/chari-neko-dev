<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Action Research / レース確認</title><link rel="stylesheet" href="/style.css"></head>
<body><header><strong>ACTION RESEARCH</strong><span>ローカル収集・レース確認</span><span id="connection">接続中</span></header>
<main><section class="toolbar"><label>確認者ID <input id="reviewer" maxlength="100" placeholder="例：ryuse"></label><button id="pending">未確認レース</button><button id="all">確認済みを含む</button><button id="refresh">更新</button><span id="message" role="status"></span></section>
<section id="coverage" aria-label="収集状況"></section>
<div class="workspace"><aside><h2>レース一覧</h2><div id="races"></div><button id="more" hidden>さらに表示</button></aside><article id="review"><h1>未確認レースを選択</h1><p>確認者IDを入力してください。映像や独立した観測がない項目はUNKNOWNで保存します。</p></article></div>
<details><summary>state別・条件別の進捗</summary><div id="details"></div></details>
<footer>Q1〜Q4: ↑↓で質問移動 / 1〜6で選択 / UでUNKNOWN / Ctrl+Enterで保存して次へ / Alt+←で前R。回答途中はこのブラウザに自動保存されます。</footer>
</main><script type="module" src="/app.mjs"></script></body></html>
