<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レース映像確認</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>レース映像確認</strong><span>Research 専用</span><span id="connection">接続中</span></header><main><section class="toolbar"><label>確認者ID <input id="reviewer" maxlength="100" placeholder="例：ryuse"></label><label>表示期間 <select id="period"><option value="recent2">今日・昨日</option><option value="today">今日</option><option value="yesterday">昨日</option><option value="recent3">直近3日</option><option value="all">すべて</option></select></label><button id="pending">未確認のみ</button><button id="all">確認済みを含む</button><button id="refresh">更新</button><span id="message" role="status" aria-live="polite"></span></section><section id="coverage"></section><div class="workspace"><aside><h2>レース一覧</h2><div id="races"></div><button id="more" hidden>さらに表示</button></aside><article id="review"><h1>未確認レースを選択</h1><p>映像で判断できない項目は「不明」のまま保存して構いません。</p></article></div><details><summary>状態別の進捗</summary><div id="details"></div></details><footer>数字で選択 / Uで不明 / Ctrl+Enterで保存して次へ / Alt+←で前のレース。回答途中は自動保存されます。</footer></main><script type="module" src="/app-v2.mjs"></script></body></html>
